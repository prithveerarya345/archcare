[project]
name = "archcare"
version = "0.1.0"
description = "Keep an Arch Linux machine updated, backed up, clean and healthy"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["arch-linux", "dotfiles", "backup", "systemd", "automation", "cli"]
classifiers = [
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Systems Administration",
    "Topic :: System :: Archiving :: Backup",
]
authors = [
    { name = "prithveerarya345", email = "prithveeraryasb@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "rich>=15.0.0",
    "tomlkit>=0.15.1",
    "typer>=0.27.3",
]

[project.urls]
Repository = "https://github.com/prithveerarya345/archcare"

[project.scripts]
archcare = "archcare.cli:main"

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "PLW"]
